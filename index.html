<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>API Rate Limiter Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main application container -->
    <div class="container">

        <h1>API Rate Limiter Simulation</h1>

        <!-- Rate limit configuration section -->
        <div class="controls">
            <label for="rateLimit">Rate Limit (calls per second):</label>
            <input type="number" id="rateLimit" min="1" value="3">
            <button id="applyLimit">Apply Limit</button>
        </div>

        <!-- Button to simulate throttled API call -->
        <button id="apiButton" class="api-btn">
            Simulate API Call
        </button>

        <!-- Displays real-time allowed and blocked counters -->
        <div class="stats">
            <p>Allowed Calls: <span id="allowedCount">0</span></p>
            <p>Blocked Calls: <span id="blockedCount">0</span></p>
        </div>

        <!-- Execution log with timestamps -->
        <div class="log">
            <h3>Call Log</h3>
            <ul id="logList"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
